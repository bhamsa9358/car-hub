        function App() {
            const [cars, setCars] = useState(INITIAL_CARS);
            const [activeCategoryTab, setActiveCategoryTab] = useState('all'); // 'all', 'launch', 'imported', 'vintage', 'jeep', 'used'
            const [selectedFuel, setSelectedFuel] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCar, setSelectedCar] = useState(null);
            const [activeMainTab, setActiveMainTab] = useState('upcoming'); // 'upcoming', 'price-drop', 'scanner', 'ai-assistant', 'wishlist'
            const [wishlist, setWishlist] = useState([]);
            const [priceFilter, setPriceFilter] = useState('all');

            // Easy Operating Mode Toggle
            const [easyMode, setEasyMode] = useState(true);
            const [isListening, setIsListening] = useState(false);
            const [showWhatsappModal, setShowWhatsappModal] = useState(false);
            const [userPhone, setUserPhone] = useState('');

            // Calculator state
            const [calcCarYear, setCalcCarYear] = useState('2022');
            const [calcKm, setCalcKm] = useState('30000');
            const [calculatedResale, setCalculatedResale] = useState(null);

            // Diagnostic state
            const [customIssueText, setCustomIssueText] = useState('');
            const [diagnosticResult, setDiagnosticResult] = useState(null);
            const [isDiagnosing, setIsDiagnosing] = useState(false);
            const [selectedSymptom, setSelectedSymptom] = useState(null);

            // AI State
            const [aiQuestion, setAiQuestion] = useState('');
            const [aiChatHistory, setAiChatHistory] = useState([
                { sender: 'bot', text: 'Hello! I am your AutoPulse AI Consultant. Ask me: Which cars or Jeeps are launching next month, what are fair prices for 2nd owner cars, or how to fix a problem in your car?' }
            ]);
            const [aiLoading, setAiLoading] = useState(false);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeMainTab, selectedCar, cars, aiChatHistory, activeCategoryTab, easyMode, diagnosticResult]);

            const toggleWishlist = (carId) => {
                if (wishlist.includes(carId)) {
                    setWishlist(wishlist.filter(id => id !== carId));
                } else {
                    setWishlist([...wishlist, carId]);
                }
            };

            // Voice Search Handler
            const handleVoiceSearch = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Voice recognition is not supported in your browser. Please type in the search bar below.");
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.onstart = () => setIsListening(true);
                recognition.onend = () => setIsListening(false);
                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    setSearchQuery(text);
                    setCustomIssueText(text);
                };
                recognition.start();
            };

            // Resale Value Calculator
            const calculateResalePrice = () => {
                const age = 2026 - parseInt(calcCarYear);
                const km = parseInt(calcKm);
                let depreciationPercent = (age * 9) + (km / 10000 * 2.5);
                if (depreciationPercent > 65) depreciationPercent = 65;
                if (depreciationPercent < 10) depreciationPercent = 10;

                const basePrice = 18.0; 
                const predictedVal = (basePrice * (100 - depreciationPercent) / 100).toFixed(2);
                setCalculatedResale({
                    val: predictedVal,
                    depreciation: depreciationPercent.toFixed(0),
                    bestMonth: 'October - December (Festive Offers & Year-End Clearance)'
                });
            };

            // Diagnostic Handler
            const handleDiagnoseIssue = async (issueObj = null) => {
                const issueQuery = issueObj ? issueObj.title : customIssueText;
                if (!issueQuery.trim()) return;

                setIsDiagnosing(true);
                if (issueObj) {
                    setSelectedSymptom(issueObj);
                }

                try {
                    const systemPrompt = `You are an expert Automobile Mechanic and Car Diagnostic Specialist. 
Analyze the car problem description or symptom in clear English.
Provide:
1. Exact Root Cause
2. Immediate DIY Fix / Steps to resolve
3. Severity Level (Normal, Medium, High, Critical)
4. Estimated Repair Cost in Indian Rupees (₹).
Keep answer short, structured with clear emojis and bullet points for easy understanding.`;

                    const payload = {
                        contents: [{ role: 'user', parts: [{ text: `Diagnose this car problem: ${issueQuery}` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    };

                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                    let response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        setDiagnosticResult(text);
                    } else if (issueObj) {
                        setDiagnosticResult(`🔧 **Diagnostic Solution for ${issueObj.title}**\n\n**Possible Causes:**\n• ${issueObj.possibleCauses.join('\n• ')}\n\n**Immediate Action & Solution:**\n${issueObj.diySolution}\n\n**Estimated Cost:** ${issueObj.estimatedCost}`);
                    } else {
                        setDiagnosticResult("⚠️ Engine Check: Oil level, Battery Terminals, Radiator Coolant, and Air Filter should be inspected immediately.");
                    }
                } catch (e) {
                    if (issueObj) {
                        setDiagnosticResult(`🔧 **Diagnostic Solution for ${issueObj.title}**\n\n**Possible Causes:**\n• ${issueObj.possibleCauses.join('\n• ')}\n\n**Immediate Action & Solution:**\n${issueObj.diySolution}\n\n**Estimated Cost:** ${issueObj.estimatedCost}`);
                    } else {
                        setDiagnosticResult("⚠️ System offline. Please check engine oil, coolant level, and battery connections.");
                    }
                } finally {
                    setIsDiagnosing(false);
                }
            };

            // Main Filtering Logic
            const filteredCars = useMemo(() => {
                return cars.filter(car => {
                    const matchesCategoryTab = activeCategoryTab === 'all' || car.type === activeCategoryTab;
                    const matchesFuel = selectedFuel === 'All' || car.fuelTypes.includes(selectedFuel);
                    const matchesSearch = car.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          car.brand.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          car.category.toLowerCase().includes(searchQuery.toLowerCase());

                    let matchesPrice = true;
                    if (priceFilter === 'under15') matchesPrice = car.minPriceNum < 15;
                    else if (priceFilter === '15to30') matchesPrice = car.minPriceNum >= 15 && car.minPriceNum <= 30;
                    else if (priceFilter === 'luxury') matchesPrice = car.maxPriceNum > 30;

                    return matchesCategoryTab && matchesFuel && matchesSearch && matchesPrice;
                });
            }, [cars, activeCategoryTab, selectedFuel, searchQuery, priceFilter]);

            const handleAskAI = async (customPrompt = null) => {
                const questionToAsk = customPrompt || aiQuestion;
                if (!questionToAsk.trim()) return;

                const userMsg = { sender: 'user', text: questionToAsk };
                setAiChatHistory(prev => [...prev, userMsg]);
                if (!customPrompt) setAiQuestion('');
                setAiLoading(true);

                try {
                    const systemPrompt = `You are AutoPulse AI, an expert automotive analyst. Answer user questions in clear, professional English.
Provide detailed information about upcoming new car launches, 4x4 Jeeps, 2nd owner used cars market prices, imported CBU cars, vintage classic car auctions, expected launch dates, prices in Lakhs/Crores, and predict WHEN prices or rates will drop or discounts will be offered.
Keep responses concise, easy to operate for normal users, structured with bullet points.`;

                    const payload = {
                        contents: [{ role: 'user', parts: [{ text: questionToAsk }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    };

                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                    let response;
                    let retries = 0;
                    let delay = 1000;
                    while (retries < 3) {
                        try {
                            response = await fetch(apiUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            if (response.ok) break;
                        } catch (e) {}
                        retries++;
                        await new Promise(r => setTimeout(r, delay));
                        delay *= 2;
                    }

                    if (!response || !response.ok) throw new Error("API failed");

                    const result = await response.json();

                        )}

                        {/* TAB 4: AUTOBOT AI ASSISTANT */}
                        {activeMainTab === 'ai-assistant' && (
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden flex flex-col h-[600px] shadow-2xl">
                                <div className="bg-slate-950 p-4 border-b border-slate-800 flex items-center gap-3">
                                    <div className="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center">
                                        <i data-lucide="bot" className="w-5 h-5 text-amber-400"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-white text-sm">AutoBot AI Consultant</h3>
                                        <p className="text-xs text-emerald-400 flex items-center gap-1">
                                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online Live
                                        </p>
                                    </div>
                                </div>

                                <div className="flex-1 p-4 overflow-y-auto space-y-4 custom-scrollbar">
                                    {aiChatHistory.map((msg, index) => (
                                        <div key={index} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-xs sm:text-sm ${
                                                msg.sender === 'user' 
                                                    ? 'bg-brand-600 text-white rounded-br-none' 
                                                    : 'bg-slate-800 border border-slate-700 text-slate-200 rounded-bl-none whitespace-pre-line'
                                            }`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                    {aiLoading && (
                                        <div className="text-xs text-slate-400">AutoBot is preparing your answer...</div>
                                    )}
                                </div>

                                <div className="p-3 bg-slate-950 border-t border-slate-800 flex gap-2">
                                    <input 
                                        type="text" 
                                        value={aiQuestion}
                                        onChange={(e) => setAiQuestion(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleAskAI()}
                                        placeholder="Type your question in English..."
                                        className="flex-1 bg-slate-900 border border-slate-800 text-xs text-slate-200 px-4 py-2.5 rounded-xl focus:outline-none focus:border-amber-500"
                                    />
                                    <button 
                                        onClick={() => handleAskAI()}
                                        className="bg-brand-600 text-white font-semibold px-5 py-2.5 rounded-xl text-xs">
                                        Send
                                    </button>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* WhatsApp Price Alert Modal */}
                    {showWhatsappModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-emerald-500/40 rounded-3xl max-w-md w-full p-6 text-center relative shadow-2xl">
                                <button 
                                    onClick={() => setShowWhatsappModal(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-white">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-500/30">
                                    <i data-lucide="message-circle" className="w-8 h-8"></i>
                                </div>

                                <h3 className="text-lg font-black text-white mb-1">Get WhatsApp Rate Drop Alerts</h3>
                                <p className="text-xs text-slate-300 mb-4">
                                    Enter your mobile number to get instant WhatsApp notifications when prices drop for your favorite cars or 2nd owner Jeeps:
                                </p>

                                <input 
                                    type="tel"
                                    placeholder="Enter 10-digit Mobile Number"
                                    value={userPhone}
                                    onChange={(e) => setUserPhone(e.target.value)}
                                    className="w-full bg-slate-950 border border-slate-800 text-sm text-center text-white px-4 py-3 rounded-xl mb-4 focus:outline-none focus:border-emerald-500"
                                />

                                <button 
                                    onClick={() => {
                                        if (userPhone.length < 10) {
                                            alert("Please enter a valid 10-digit mobile number.");
                                            return;
                                        }
                                        alert("✅ Thank you! Your price alert is registered. You will receive a WhatsApp message when prices drop!");
                                        setShowWhatsappModal(false);
                                        setUserPhone('');
                                    }}
                                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/20">
                                    Activate Free WhatsApp Alert
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Vehicle Details Modal */}
                    {selectedCar && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar p-6 relative shadow-2xl">
                                <button 
                                    onClick={() => setSelectedCar(null)}
                                    className="absolute top-4 right-4 bg-slate-800 text-slate-400 hover:text-white p-2 rounded-full">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <h2 className="text-2xl font-black text-white mb-1">{selectedCar.name}</h2>
                                <p className="text-2xl font-extrabold text-amber-400 mb-4">{selectedCar.expectedPrice}</p>

                                <img src={selectedCar.image} className="w-full h-56 object-cover rounded-2xl mb-6 border border-slate-800" alt="" />

                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6 text-xs">
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                                        <span className="text-slate-500 block">Engine / Power</span>
                                        <span className="font-bold text-white">{selectedCar.engineBattery}</span>
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                                        <span className="text-slate-500 block">Mileage</span>
                                        <span className="font-bold text-white">{selectedCar.rangeMileage}</span>
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                                        <span className="text-slate-500 block">Status</span>
                                        <span className="font-bold text-emerald-400">{selectedCar.bookingStatus}</span>
                                    </div>
                                </div>

                                <div className="bg-emerald-500/10 p-4 rounded-2xl border border-emerald-500/20 mb-6">
                                    <h4 className="text-xs font-bold text-emerald-400 uppercase mb-1">Rate Down Prediction:</h4>
                                    <p className="text-sm font-bold text-white">{selectedCar.bestTimeToBuy}</p>
                                    <p className="text-xs text-slate-300 mt-1">{selectedCar.priceCutReason}</p>
                                </div>

                                <button 
                                    onClick={() => {
                                        toggleWishlist(selectedCar.id);
                                        setSelectedCar(null);
                                    }}
                                    className="w-full py-3 rounded-xl text-xs font-bold bg-brand-600 hover:bg-brand-500 text-white">
                                    {wishlist.includes(selectedCar.id) ? 'Remove Alert' : 'Set Price Drop Alert'}
                                </button>
                            </div>
                        </div>
                    )}

                    <footer className="bg-slate-950 border-t border-slate-900 py-6 px-4 text-center text-xs text-slate-500">
                        <p>© 2026 AutoPulse - Super Easy Operating Car & Diagnostic Companion.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
